<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PCMC Digital Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative font-sans" 
      style="background-image: url('js/pcmc-bg.jpg'); background-size: cover; background-position: center;">
    
    <div class="absolute inset-0 bg-[#0f4a73]/70 backdrop-blur-sm"></div>

    <main class="relative bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col z-10">
        
        <!-- Header Section -->
        <div class="px-8 pt-8 pb-4 text-center">
            <div class="flex justify-center items-center gap-2 text-blue-900 mb-2">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 15l10 5 10-5M2 11l10 5 10-5"/></svg>
                <h1 class="text-2xl font-bold tracking-tight">PCMC Portal</h1>
            </div>
            <h2 class="text-xl font-bold text-slate-800 mt-4">Welcome Back</h2>
            <p class="text-slate-500 text-sm mt-1">Please authenticate to access your account.</p>
        </div>

        <!-- Login Type Tabs -->
        <div class="flex border-b border-slate-200 mx-8 mt-2">
            <button id="tabCitizen" class="flex-1 pb-3 text-sm font-bold text-blue-900 border-b-2 border-blue-900 transition-colors">Citizen Login</button>
            <button id="tabOfficer" class="flex-1 pb-3 text-sm font-medium text-slate-500 hover:text-blue-900 transition-colors">Officer Login</button>
        </div>

        <!-- Form Section -->
        <div class="px-8 py-6">
            
            <label class="block text-xs font-bold text-slate-700 mb-2">Mobile Number</label>
            <div class="flex border border-slate-300 rounded-lg overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 mb-2 transition-all shadow-sm">
                <span class="bg-slate-50 px-3 py-3 text-slate-500 text-sm border-r border-slate-300 font-medium">+91</span>
                <input type="tel" id="mobileInput" placeholder="Enter 10-digit number" class="w-full px-4 py-3 text-sm outline-none text-slate-800" maxlength="10">
            </div>
            <p class="text-xs text-slate-500 mb-5 flex items-center gap-1">
                <span class="border border-slate-300 rounded-full w-4 h-4 flex items-center justify-center text-[10px]">i</span> 
                OTP will be sent to this number.
            </p>
            
            <button id="requestOtpBtn" class="w-full bg-[#0f4a73] hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-lg text-sm transition-colors flex justify-center items-center gap-2 shadow-md">
                Request OTP <span>→</span>
            </button>

            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-bold uppercase tracking-wider">Or</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <button id="gmailLoginBtn" class="w-full bg-white border border-slate-300 text-slate-700 font-bold py-3 px-4 rounded-lg text-sm hover:bg-slate-50 transition-colors flex justify-center items-center gap-3 shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Gmail
            </button>

            <!-- Sign Up Link -->
            <div id="signUpLinkContainer" class="text-center mt-6 transition-opacity duration-300">
                <p class="text-sm text-slate-600">Don't have an account? <a href="signup.html" class="text-blue-700 font-bold hover:underline">Sign up</a></p>
            </div>

            <!-- Bhashini Banner -->
            <div class="mt-6 bg-slate-50 border border-slate-200 rounded-lg p-3 flex justify-between items-center text-xs text-slate-600 font-bold cursor-pointer hover:bg-slate-100 transition-colors">
                <div class="flex items-center gap-3">
                    <span class="text-base bg-white px-2 py-1 rounded border border-slate-200 shadow-sm">A/अ</span>
                    Powered by Bhashini
                </div>
                <span class="text-slate-400">↗</span>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const tabCitizen = document.getElementById("tabCitizen");
            const tabOfficer = document.getElementById("tabOfficer");
            const requestOtpBtn = document.getElementById("requestOtpBtn");
            const gmailLoginBtn = document.getElementById("gmailLoginBtn");
            const mobileInput = document.getElementById("mobileInput");
            const signUpLinkContainer = document.getElementById("signUpLinkContainer");
            
            let currentMode = "citizen"; 

            tabCitizen.addEventListener("click", () => {
                currentMode = "citizen";
                tabCitizen.className = "flex-1 pb-3 text-sm font-bold text-blue-900 border-b-2 border-blue-900 transition-colors";
                tabOfficer.className = "flex-1 pb-3 text-sm font-medium text-slate-500 border-b-2 border-transparent hover:text-blue-900 transition-colors";
                
                signUpLinkContainer.style.display = "block";
            });

            tabOfficer.addEventListener("click", () => {
                currentMode = "officer";
                tabOfficer.className = "flex-1 pb-3 text-sm font-bold text-blue-900 border-b-2 border-blue-900 transition-colors";
                tabCitizen.className = "flex-1 pb-3 text-sm font-medium text-slate-500 border-b-2 border-transparent hover:text-blue-900 transition-colors";
                
                signUpLinkContainer.style.display = "none";
            });

            function handleLogin(method) {
                if (method === 'otp' && mobileInput.value.length < 10) {
                    alert("Please enter a valid 10-digit mobile number.");
                    return;
                }
                if (method === 'otp') {
                    const otp = prompt(`An OTP has been sent to +91 ${mobileInput.value}.\n\nEnter 1234 to verify:`);
                    if (otp !== "1234") {
                        alert("Invalid OTP. Please try again.");
                        return;
                    }
                } else {
                    alert("Redirecting to Google secure login...");
                }

                if (currentMode === "officer") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "index.html"; 
                }
            }

            requestOtpBtn.addEventListener("click", () => handleLogin('otp'));
            gmailLoginBtn.addEventListener("click", () => handleLogin('gmail'));
        });
    </script>
</body>
</html>
